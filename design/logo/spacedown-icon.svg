<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Spacedown">
  <title>Spacedown</title>
  <!-- mark: M + down arrow on the space bar -> "Markdown, dropping down" -->
  <defs>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E4E52"/>
      <stop offset="1" stop-color="#2C2C30"/>
    </linearGradient>
  </defs>
  <rect id="tile" width="256" height="256" rx="57" fill="url(#tileFill)"/>
  <g id="mark" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path id="M" stroke-width="22" d="M 51 132 L 51 68 L 87 114 L 123 68 L 123 132"/>
    <path id="down" stroke-width="17" d="M 185 70 L 185 137 M 163 115 L 185 137 L 207 115"/>
    <path id="spacebar" stroke-width="26" d="M 42 185 L 214 185"/>
  </g>
</svg>
